name: Deploy to Render

# Render's native GitHub auto-deploy webhook is unreliable for this repo, so we
# trigger deploys explicitly via the service's Deploy Hook. Add the hook URL as
# the repo secret RENDER_DEPLOY_HOOK (Render → service → Settings → Deploy Hook).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set." >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK" && echo "Render deploy triggered."
