# Render Blueprint — web service (Docker) only.
# Database is Neon (persistent free tier, doesn't expire). Set DATABASE_URL in
# the Render dashboard to the Neon connection string (it includes
# ?sslmode=require, which our db client uses to enable TLS).
#   In Render: New → Blueprint → pick this repo → Apply, then set DATABASE_URL.
services:
  - type: web
    name: tulparhub
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to Kazakhstan; keep DB (Neon) in EU too
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the dashboard → Neon connection string
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: NEXT_PUBLIC_YANDEX_METRICA_ID
        sync: false