# Local development: just Postgres. Run the app with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tulparhub
      POSTGRES_PASSWORD: tulparhub
      POSTGRES_DB: tulparhub
    ports:
      - "5432:5432"
    volumes:
      - tulparhub_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tulparhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tulparhub_pgdata_dev:
